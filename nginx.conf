server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
  gzip_min_length 1024;

  # Security headers. Fonts come from Google Fonts; the contact form may post to
  # a third-party form service (add its origin to connect-src when you set one).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://formspree.io https://api.github.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

  location ~* \.(?:css|js|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    # re-declare security headers (add_header in a location replaces inherited ones)
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / { try_files $uri $uri/ =404; }
}
